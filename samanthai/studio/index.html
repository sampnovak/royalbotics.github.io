<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Oakbit — SamanthAI Studio | Code</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>

  <!-- Marked JS for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 10% 20%, #101c2e 0%, #080a0f 40%),
                     radial-gradient(circle at 90% 80%, #1e112a 0%, #050508 50%);
      
      --glass-surface-1: rgba(255, 255, 255, 0.08);
      --glass-surface-2: rgba(255, 255, 255, 0.04);
      --glass-border: rgba(255, 255, 255, 0.18);
      --glass-border-highlight: rgba(255, 255, 255, 0.45);
      
      --oakbit-emerald: #10b981;
      --oakbit-cyan: #38bdf8;

      --text-main: #f8fafc;
      --text-muted: rgba(248, 250, 252, 0.55);
      
      --radius-xl: 36px;
      --radius-lg: 24px;

      --backdrop-blur: blur(40px) saturate(190%);
      --liquid-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.56),
                       0 18px 36px -18px rgba(0, 0, 0, 0.75),
                       inset 0 1px 1px 0 rgba(255, 255, 255, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      background: #050508;
      background-image: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 20px;
    }

    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
      opacity: 0.5;
      animation: floatOrb 18s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 450px; height: 450px;
      background: radial-gradient(circle, #10b981 0%, #0284c7 100%);
      top: -100px; left: -100px;
    }
    .orb-2 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #6366f1 0%, #a855f7 100%);
      bottom: -150px; right: -100px;
      animation-delay: -9s;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 40px) scale(1.1); }
      100% { transform: translate(-40px, 80px) scale(0.95); }
    }

    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 1050px;
      height: 90vh;
      max-height: 900px;
      background: var(--glass-surface-2);
      backdrop-filter: var(--backdrop-blur);
      -webkit-backdrop-filter: var(--backdrop-blur);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      box-shadow: var(--liquid-shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 18px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--glass-border);
      background: rgba(255, 255, 255, 0.02);
      backdrop-filter: blur(20px);
      z-index: 15;
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.3), rgba(255, 255, 255, 0.05));
      border: 1px solid var(--glass-border-highlight);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .brand-logo i {
      font-size: 20px;
      color: #10b981;
      filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.6));
    }

    .brand-info .company-tag {
      font-size: 0.68rem;
      color: var(--oakbit-emerald);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-info h1 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.75) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .feature-badge {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      -webkit-text-fill-color: initial;
    }

    .status-badge {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .status-badge.online {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.1);
      border-color: rgba(239, 68, 68, 0.3);
      color: #fca5a5;
    }

    .status-badge .pulse {
      width: 7px; height: 7px;
      background: #64748b;
      border-radius: 50%;
      transition: all 0.3s ease;
    }

    .status-badge.online .pulse {
      background: #10b981;
      box-shadow: 0 0 10px #10b981;
      animation: pulseGlow 2s infinite;
    }

    .status-badge.error .pulse {
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .chat-container {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 85%;
      padding: 16px 22px;
      border-radius: var(--radius-lg);
      font-size: 0.95rem;
      line-height: 1.6;
      position: relative;
      animation: messagePop 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      backdrop-filter: blur(20px);
      word-wrap: break-word;
    }

    @keyframes messagePop {
      0% { opacity: 0; transform: translateY(12px) scale(0.97); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message.user {
      align-self: flex-end;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.25), rgba(56, 189, 248, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-bottom-right-radius: 6px;
      color: #ffffff;
      white-space: pre-wrap;
    }

    .message.assistant {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 6px;
      color: #e2e8f0;
    }

    .message .sender-tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      opacity: 0.6;
    }

    /* Markdown Element Styles for Assistant Output */
    .message-body p {
      margin-bottom: 10px;
    }
    .message-body p:last-child {
      margin-bottom: 0;
    }
    .message-body h1, .message-body h2, .message-body h3, .message-body h4 {
      margin: 14px 0 8px 0;
      color: #fff;
      font-weight: 700;
    }
    .message-body ul, .message-body ol {
      margin: 8px 0 12px 20px;
    }
    .message-body li {
      margin-bottom: 4px;
    }
    .message-body code {
      font-family: 'JetBrains Mono', monospace;
      background: rgba(0, 0, 0, 0.4);
      padding: 2px 6px;
      border-radius: 6px;
      font-size: 0.88em;
      color: #38bdf8;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .message-body pre {
      background: #080a0f;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 12px 0;
      overflow-x: auto;
    }
    .message-body pre code {
      background: none;
      padding: 0;
      border: none;
      color: #34d399;
      font-size: 0.88em;
    }
    .message-body blockquote {
      border-left: 3px solid #10b981;
      padding-left: 12px;
      margin: 10px 0;
      color: var(--text-muted);
      font-style: italic;
    }
    .message-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
    }
    .message-body th, .message-body td {
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 8px 12px;
      text-align: left;
    }
    .message-body th {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .typing-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 18px 24px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      align-self: flex-start;
    }

    .typing-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
      animation: typing 1.4s infinite ease-in-out both;
    }
    .typing-dot:nth-child(1) { animation-delay: -0.32s; }
    .typing-dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes typing {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1.1); opacity: 1; background: #10b981; }
    }

    .input-dock-container {
      padding: 20px 30px 25px 30px;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(25px);
      border-top: 1px solid var(--glass-border);
    }

    .input-dock {
      display: flex;
      align-items: center;
      background: var(--glass-surface-1);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      padding: 8px 12px 8px 20px;
    }

    .chat-textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-size: 0.95rem;
      resize: none;
      max-height: 120px;
      height: 24px;
      line-height: 24px;
      font-family: 'JetBrains Mono', monospace;
    }

    .send-btn {
      width: 42px; height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, #10b981 0%, #0284c7 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      margin-left: 10px;
      flex-shrink: 0;
    }

    .empty-state {
      margin: auto;
      text-align: center;
      max-width: 440px;
      opacity: 0.85;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #10b981, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body>

  <div class="ambient-orb orb-1"></div>
  <div class="ambient-orb orb-2"></div>

  <div class="app-viewport">
    
    <header class="header">
      <div class="brand-title">
        <div class="brand-logo">
          <i class="fa-solid fa-code"></i>
        </div>
        <div class="brand-info">
          <div class="company-tag">
            <span>Oakbit</span>
            <span style="opacity:0.4;">|</span>
            <span style="text-transform:none; font-weight:400; opacity:0.7;">formerly Ro&amp;Bot</span>
          </div>
          <h1>
            SamanthAI Studio 
            <span class="feature-badge">Code</span>
          </h1>
        </div>
      </div>
      
      <div class="header-actions">
        <div class="status-badge" id="statusBadge">
          <span class="pulse"></span>
          <span id="statusText">Connecting...</span>
        </div>
      </div>
    </header>

    <main class="chat-container" id="chatContainer">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">
          <i class="fa-solid fa-terminal"></i>
        </div>
        <h2>SamanthAI Studio Code Workspace</h2>
        <p>Ask for code generation, debugging, or technical guidance formatted with full Markdown rendering.</p>
      </div>
    </main>

    <footer class="input-dock-container">
      <div class="input-dock">
        <textarea 
          id="userInput" 
          class="chat-textarea" 
          placeholder="Ask SamanthAI Studio Code to write or review code..."
          rows="1"
        ></textarea>
        <button id="sendBtn" class="send-btn" title="Send Code Request">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
    </footer>

  </div>

  <script>
    const BASE_URL = "https://openrouter.ai/api/v1";
    const API_KEY = "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";

    const MODELS = [
      "poolside/laguna-s-2.1:free",
      "openrouter/free",
      "openai/gpt-oss-20b:free",
      "nvidia/nemotron-3-nano-30b-a3b:free"
    ];

    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const emptyState = document.getElementById('emptyState');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');

    let conversationHistory = [
      {
        role: "system",
        content: "You are SamanthAI Studio Code, a high-performance code assistant developed by Oakbit (formerly Ro&Bot). Provide clean, well-explained code solutions using proper Markdown."
      }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      pingServerWithTimeout();
    });

    async function pingServerWithTimeout() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);

      try {
        const response = await fetch(`${BASE_URL}/key`, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${API_KEY}`
          },
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        if (response.ok) {
          updateStatus(true, "Connected & Ready");
          return true;
        } else {
          updateStatus(true, "Ready");
          return true;
        }
      } catch (err) {
        clearTimeout(timeoutId);
        updateStatus(true, "Ready");
        return true;
      }
    }

    function updateStatus(isOnline, text) {
      statusBadge.className = 'status-badge ' + (isOnline ? 'online' : 'error');
      statusText.textContent = text;
    }

    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSendMessage();
      }
    });

    sendBtn.addEventListener('click', handleSendMessage);

    async function handleSendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (emptyState) {
        emptyState.remove();
      }

      appendMessage('user', text);
      conversationHistory.push({ role: 'user', content: text });
      
      userInput.value = '';
      userInput.style.height = '24px';
      sendBtn.disabled = true;

      const typingElem = createTypingIndicator();
      chatContainer.appendChild(typingElem);
      scrollToBottom();

      let responseSuccess = false;
      let lastErrorMessage = "";

      for (let i = 0; i < MODELS.length; i++) {
        const currentModel = MODELS[i];
        statusText.textContent = `Routing (${i + 1}/${MODELS.length})...`;

        try {
          const response = await fetch(`${BASE_URL}/chat/completions`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${API_KEY}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: currentModel,
              messages: conversationHistory
            })
          });

          const data = await response.json();

          if (response.ok && !data.error && data.choices && data.choices[0]?.message?.content) {
            const assistantReply = data.choices[0].message.content;
            typingElem.remove();
            appendMessage('assistant', assistantReply);
            conversationHistory.push({ role: 'assistant', content: assistantReply });
            
            responseSuccess = true;
            updateStatus(true, "Connected & Ready");
            break;
          } else {
            lastErrorMessage = data.error?.message || `HTTP ${response.status}`;
            console.warn(`Model ${currentModel} error: ${lastErrorMessage}. Trying fallback...`);
          }

        } catch (err) {
          lastErrorMessage = err.message;
          console.warn(`Network failure on model ${currentModel}. Trying fallback...`);
        }
      }

      if (!responseSuccess) {
        typingElem.remove();
        appendMessage('assistant', `⚠️ All fallbacks failed: ${lastErrorMessage}`);
        updateStatus(false, "Service Error");
      }

      sendBtn.disabled = false;
      scrollToBottom();
    }

    function appendMessage(sender, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);

      const senderTag = document.createElement('div');
      senderTag.classList.add('sender-tag');
      senderTag.textContent = sender === 'user' ? 'Developer' : 'SamanthAI Studio';

      const bodyDiv = document.createElement('div');
      bodyDiv.classList.add('message-body');

      if (sender === 'assistant' && typeof marked !== 'undefined') {
        bodyDiv.innerHTML = marked.parse(text);
      } else {
        bodyDiv.textContent = text;
      }

      msgDiv.appendChild(senderTag);
      msgDiv.appendChild(bodyDiv);
      chatContainer.appendChild(msgDiv);
      scrollToBottom();
    }

    function createTypingIndicator() {
      const indicator = document.createElement('div');
      indicator.classList.add('typing-indicator');
      indicator.innerHTML = `
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
        <div class="typing-dot"></div>
      `;
      return indicator;
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }
  </script>
</body>
  </html>
