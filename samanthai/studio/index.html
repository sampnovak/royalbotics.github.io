    /* Responsive Design for Mobile & Desktop */
    @media (max-width: 768px) {      body { padding: 0; }      .app-viewport {        height: 100vh;        max-height: 100vh;        border-radius: 0;        border: none;      }      .sidebar {        position: absolute;        left: -280px;        top: 0;        bottom: 0;        height: 100%;        z-index: 100;      }      .sidebar.open {        transform: translateX(280px);        box-shadow: 20px 0 50px rgba(0,0,0,0.1);      }      .menu-toggle { display: block; }      .header { padding: 12px 16px; }      .chat-container { padding: 16px; }      .input-dock-container { padding: 12px 16px 16px 16px; }    }  </style></head><body>

  <script>    const BASE_URL = "https://openrouter.ai/api/v1";    const API_KEY = "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";

    const MODELS = [      "poolside/laguna-s-2.1:free",      "openrouter/free",      "openai/gpt-oss-20b:free",      "nvidia/nemotron-3-nano-30b-a3b:free"    ];

    const chatContainer = document.getElementById('chatContainer');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const emptyState = document.getElementById('emptyState');
    const statusBadge = document.getElementById('statusBadge');
    const statusText = document.getElementById('statusText');
    const chatHistoryList = document.getElementById('chatHistoryList');
    const newChatBtn = document.getElementById('newChatBtn');
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');

    const dynamicWindowWrapper = document.getElementById('dynamicWindowWrapper');
    const dynamicTabContainer = document.getElementById('dynamicTabContainer');
    const dynamicTabContent = document.getElementById('dynamicTabContent');
    const openDynamicTabBtn = document.getElementById('openDynamicTabBtn');
    const closeDynamicBtn = document.getElementById('closeDynamicBtn');
    const appViewport = document.getElementById('appViewport');

    let chats = JSON.parse(localStorage.getItem('oakbit_chats')) || [];
    let currentChatId = localStorage.getItem('oakbit_current_chat') || null;

    let conversationHistory = [
      {        role: "system",        content: "You are SamanthAI Studio Code, an advanced code assistant developed by Oakbit. When the user asks you to transform the interface theme or window layout (like 'Make this look like an ancient Greek themed tab', 'cyberpunk hacking window', or 'noir detective view'), output TWO things in your reply: 1) A ```styleblock ... ``` tag containing custom CSS rules to alter body/viewport colors, fonts, and accents, AND 2) A ```html ... ``` code block if they also requested an interactive app or game for the Dynamic Tab. Always provide warm conversational assistance as well."      }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      pingServerWithTimeout();
      initChatStorage();
    });

    menuToggle.addEventListener('click', () => sidebar.classList.toggle('open'));
    newChatBtn.addEventListener('click', () => {
      createNewChat();
      if (window.innerWidth <= 768) sidebar.classList.remove('open');
    });

    closeDynamicBtn.addEventListener('click', () => {
      dynamicTabContainer.style.display = 'none';
    });

    openDynamicTabBtn.addEventListener('click', () => {
      dynamicTabContainer.style.display = 'flex';
    });

    function initChatStorage() {
      if (chats.length === 0) {
        createNewChat();
      } else {
        if (!currentChatId || !chats.find(c => c.id == currentChatId)) {
          currentChatId = chats[0].id;
        }
        loadChat(currentChatId);
      }
      renderChatHistory();
    }

    function createNewChat() {
      const newId = 'chat_' + Date.now();
      const newChatObj = {
        id: newId,
        title: 'New Code Session',
        dynamicHtml: null,
        customStyle: null,
        history: [
          {        role: "system",        content: "You are SamanthAI Studio Code, an advanced code assistant developed by Oakbit. When the user asks you to transform the interface theme or window layout, output a ```styleblock ... ``` with CSS and/or a ```html ... ``` block for apps."      }
        ]
      };
      chats.unshift(newChatObj);
      currentChatId = newId;
      saveChatsToLocalStorage();
      loadChat(currentChatId);
      renderChatHistory();
    }

    function loadChat(id) {
      currentChatId = id;
      localStorage.setItem('oakbit_current_chat', id);
      const chat = chats.find(c => c.id == id);
      if (!chat) return;

      conversationHistory = JSON.parse(JSON.stringify(chat.history));
      chatContainer.innerHTML = '';

      // Apply saved custom theme style if any
      applyCustomStyle(chat.customStyle);

      if (chat.dynamicHtml) {
        dynamicTabContent.innerHTML = chat.dynamicHtml;
        openDynamicTabBtn.style.display = 'flex';
      } else {
        dynamicTabContent.innerHTML = '';
        openDynamicTabBtn.style.display = 'none';
        dynamicTabContainer.style.display = 'none';
      }

      const nonSystemMessages = conversationHistory.filter(m => m.role !== 'system');
      if (nonSystemMessages.length === 0) {
        chatContainer.appendChild(emptyState);
      } else {
        if (emptyState && emptyState.parentNode) emptyState.remove();
        nonSystemMessages.forEach(msg => {
          appendMessageDOM(msg.role, msg.content, false);
        });
      }
      scrollToBottom();
      renderChatHistory();
    }

    function applyCustomStyle(cssCode) {
      let existingStyleTag = document.getElementById('dynamicCustomTheme');
      if (existingStyleTag) existingStyleTag.remove();

      if (cssCode) {
        const styleTag = document.createElement('style');
        styleTag.id = 'dynamicCustomTheme';
        styleTag.textContent = cssCode;
        document.head.appendChild(styleTag);
      }
    }

    function saveChatsToLocalStorage() {
      localStorage.setItem('oakbit_chats', JSON.stringify(chats));
    }

    function renderChatHistory() {
      chatHistoryList.innerHTML = '';
      chats.forEach(chat => {
        const item = document.createElement('div');
        item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
        
        const titleSpan = document.createElement('span');
        titleSpan.textContent = chat.title;
        titleSpan.style.flex = '1';
        titleSpan.style.overflow = 'hidden';
        titleSpan.style.textOverflow = 'ellipsis';
        titleSpan.onclick = () => {
          loadChat(chat.id);
          if (window.innerWidth <= 768) sidebar.classList.remove('open');
        };

        const deleteBtn = document.createElement('i');
        deleteBtn.className = 'fa-solid fa-trash delete-chat';
        deleteBtn.onclick = (e) => {
          e.stopPropagation();
          deleteChat(chat.id);
        };

        item.appendChild(titleSpan);
        item.appendChild(deleteBtn);
        chatHistoryList.appendChild(item);
      });
    }

    function deleteChat(id) {
      chats = chats.filter(c => c.id !== id);
      if (chats.length === 0) {
        createNewChat();
      } else if (currentChatId === id) {
        loadChat(chats[0].id);
      }
      saveChatsToLocalStorage();
      renderChatHistory();
    }

    async function pingServerWithTimeout() {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);

      try {
        await fetch(`${BASE_URL}/key`, {
          method: "GET",
          headers: { "Authorization": `Bearer ${API_KEY}` },
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        updateStatus(true, "Connected & Ready");
        return true;
      } catch (err) {
        clearTimeout(timeoutId);
        updateStatus(true, "Ready");
        return true;
      }
    }

    function updateStatus(isOnline, text) {
      statusBadge.className = 'status-badge ' + (isOnline ? 'online' : 'error');
      statusText.textContent = text;
    }

    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    });

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSendMessage();
      }
    });

    sendBtn.addEventListener('click', handleSendMessage);

    async function handleSendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      if (emptyState && emptyState.parentNode) emptyState.remove();

      appendMessage('user', text);
      conversationHistory.push({ role: 'user', content: text });
            
      const activeChat = chats.find(c => c.id === currentChatId);
      if (activeChat && activeChat.title === 'New Code Session') {
        activeChat.title = text.length > 25 ? text.substring(0, 25) + '...' : text;
      }
      activeChat.history = JSON.parse(JSON.stringify(conversationHistory));
      saveChatsToLocalStorage();
      renderChatHistory();

      userInput.value = '';
      userInput.style.height = '24px';
      sendBtn.disabled = true;

      const typingElem = createTypingIndicator();
      chatContainer.appendChild(typingElem);
      scrollToBottom();

      let responseSuccess = false;
      let lastErrorMessage = "";

      for (let i = 0; i < MODELS.length; i++) {
        const currentModel = MODELS[i];
        statusText.textContent = `Routing (${i + 1}/${MODELS.length})...`;

        try {
          const response = await fetch(`${BASE_URL}/chat/completions`, {
            method: "POST",
            headers: {
              "Authorization": `Bearer ${API_KEY}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: currentModel,
              messages: conversationHistory
            })
          });

          const data = await response.json();

          if (response.ok && !data.error && data.choices && data.choices[0]?.message?.content) {
            const assistantReply = data.choices[0].message.content;
            typingElem.remove();
            appendMessage('assistant', assistantReply);
            conversationHistory.push({ role: 'assistant', content: assistantReply });
                        
            // Check if assistant provided style adjustments to redesign the window itself
            const styleMatch = assistantReply.match(/```styleblock([\s\S]*?)```/i);
            if (styleMatch && styleMatch[1]) {
              const customCss = styleMatch[1].trim();
              activeChat.customStyle = customCss;
              applyCustomStyle(customCss);
            }

            // Check if assistant provided an executable html block for Dynamic Tab apps
            const htmlMatch = assistantReply.match(/```html([\s\S]*?)```/i);
            if (htmlMatch && htmlMatch[1]) {
              const codeContent = htmlMatch[1].trim();
              activeChat.dynamicHtml = codeContent;
              dynamicTabContent.innerHTML = codeContent;
              openDynamicTabBtn.style.display = 'flex';
              dynamicTabContainer.style.display = 'flex';
              
              const scripts = dynamicTabContent.querySelectorAll('script');
              scripts.forEach(script => {
                const newScript = document.createElement('script');
                newScript.text = script.innerHTML;
                script.parentNode.replaceChild(newScript, script);
              });
            }

            activeChat.history = JSON.parse(JSON.stringify(conversationHistory));
            saveChatsToLocalStorage();

            responseSuccess = true;
            updateStatus(true, "Connected & Ready");
            break;
          } else {
            lastErrorMessage = data.error?.message || `HTTP ${response.status}`;
          }
        } catch (err) {
          lastErrorMessage = err.message;
        }
      }

      if (!responseSuccess) {
        typingElem.remove();
        appendMessage('assistant', `⚠️ All fallbacks failed: ${lastErrorMessage}`);
        updateStatus(false, "Service Error");
      }

      sendBtn.disabled = false;
      scrollToBottom();
    }

    function appendMessage(sender, text) {
      appendMessageDOM(sender, text, true);
    }

    function appendMessageDOM(sender, text, animate = true) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', sender);
      if (!animate) msgDiv.style.animation = 'none';

      const senderTag = document.createElement('div');
      senderTag.classList.add('sender-tag');
      senderTag.textContent = sender === 'user' ? 'Developer' : 'SamanthAI Studio';

      const bodyDiv = document.createElement('div');
      bodyDiv.classList.add('message-body');

      if (sender === 'assistant' && typeof marked !== 'undefined') {
        bodyDiv.innerHTML = marked.parse(text);
      } else {
        bodyDiv.textContent = text;
      }

      msgDiv.appendChild(senderTag);
      msgDiv.appendChild(bodyDiv);
      chatContainer.appendChild(msgDiv);
    }

    function createTypingIndicator() {
      const indicator = document.createElement('div');
      indicator.classList.add('typing-indicator');
      indicator.innerHTML = `        <div class="typing-dot"></div>        <div class="typing-dot"></div>        <div class="typing-dot"></div>      `;
      return indicator;
    }

    function scrollToBottom() {
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }  </script></body></html>
